<!DOCTYPE html>
<html>

    <head>
        <title>Clock</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="clock-wrapper">
            <div id="clock" class="clock-text"></div>
        </div>

        <script>
            function showTime() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                const timeString = `${hours}:${minutes}:${seconds}`
                    .split('')
                    .map((character) => character === ':'
                        ? '<span class="coron">:</span>'
                        : `<span class="num">${character}</span>`)
                    .join('');

                document.getElementById('clock').innerHTML = timeString;
            }
            showTime();
            setInterval(showTime, 100);
        </script>
    </body>

</html>
